    <!-- Suppress Vite HMR WebSocket connection failure per environment constraints (HMR is disabled in AI Studio) -->
    <script>
      (function () {
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function (url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.includes(':24678') || url.includes('token=') || url.includes('vite-hmr')));
            if (isViteHmr) {
              const mockWs = new EventTarget();
              mockWs.binaryType = 'blob';
              mockWs.readyState = 1; // OPEN
              mockWs.bufferedAmount = 0;
              mockWs.extensions = '';
              mockWs.protocol = 'vite-hmr';
              mockWs.url = typeof url === 'string' ? url : '';
              mockWs.send = function () {};
              mockWs.close = function () {
                mockWs.readyState = 3;
                try {
                  const closeEvt = new CloseEvent('close', { wasClean: true, code: 1000 });
                  if (typeof mockWs.onclose === 'function') mockWs.onclose(closeEvt);
                  mockWs.dispatchEvent(closeEvt);
                } catch (_) {}
              };
              setTimeout(() => {
                try {
                  const openEvt = new Event('open');
                  if (typeof mockWs.onopen === 'function') mockWs.onopen(openEvt);
                  mockWs.dispatchEvent(openEvt);
                } catch (_) {}
              }, 0);
              return mockWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function (e) {
          const msg = String(e?.reason?.message || '');
          const stack = String(e?.reason?.stack || '');
          if (
            msg.includes('WebSocket') ||
            msg.includes('vite:ws') ||
            stack.includes('createWebSocketModuleRunnerTransport') ||
            stack.includes('@vite/client')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          const msg = String(e?.message || '');
          const filename = String(e?.filename || '');
          const stack = String(e?.error?.stack || '');
          if (
            msg.includes('WebSocket') ||
            filename.includes('@vite/client') ||
            stack.includes('createWebSocketModuleRunnerTransport')
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
